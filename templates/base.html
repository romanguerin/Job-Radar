<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Job Radar{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/?user_id={{ user.id }}">Job Radar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/?user_id={{ user.id }}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'jobs' %}active{% endif %}" href="/jobs?user_id={{ user.id }}">Jobs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'saved' %}active{% endif %}" href="/saved?user_id={{ user.id }}">Saved</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'settings' %}active{% endif %}" href="/settings?user_id={{ user.id }}">Settings</a>
                </li>
            </ul>
            <form class="d-flex align-items-center gap-2" method="get" action="{{ request.url.path }}">
                <label class="small text-secondary" for="user_id">User</label>
                <select class="form-select form-select-sm user-select" name="user_id" id="user_id" onchange="this.form.submit()">
                    {% for option in users %}
                        <option value="{{ option.id }}" {% if option.id == user.id %}selected{% endif %}>{{ option.name }}</option>
                    {% endfor %}
                </select>
            </form>
        </div>
    </div>
</nav>

<main class="container-fluid py-4">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
